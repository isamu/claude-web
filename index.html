<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Web</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #1a1a2e; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
    #header { padding: 12px 20px; background: #16213e; border-bottom: 1px solid #0f3460; font-size: 14px; color: #94a3b8; display: flex; align-items: center; gap: 12px; }
    #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 80%; padding: 10px 14px; border-radius: 8px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
    .msg.user { align-self: flex-end; background: #0f3460; color: #e0e0e0; }
    .msg.assistant { align-self: flex-start; background: #222; color: #e0e0e0; }
    .msg.error { align-self: flex-start; background: #3d1111; color: #fca5a5; }
    .msg.streaming { border-left: 3px solid #53c28b; }
    .msg .tool-badge { display: inline-block; background: #0f3460; color: #53c28b; padding: 2px 8px; border-radius: 4px; font-size: 12px; margin: 2px 4px 2px 0; }
    .msg .cost-info { font-size: 11px; color: #64748b; margin-top: 8px; border-top: 1px solid #333; padding-top: 6px; }
    #input-area { padding: 16px 20px; background: #16213e; border-top: 1px solid #0f3460; display: flex; gap: 8px; }
    #prompt { flex: 1; padding: 10px 14px; border: 1px solid #0f3460; border-radius: 6px; background: #1a1a2e; color: #e0e0e0; font-size: 14px; resize: none; height: 44px; }
    #prompt:focus { outline: none; border-color: #53c28b; }
    button { padding: 10px 20px; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; }
    #send { background: #53c28b; color: #1a1a2e; font-weight: 600; }
    #send:disabled { opacity: 0.5; cursor: not-allowed; }
    #continue-toggle { background: none; border: 1px solid #0f3460; color: #94a3b8; font-size: 12px; padding: 6px 12px; }
    #continue-toggle.active { border-color: #53c28b; color: #53c28b; }
  </style>
</head>
<body>
  <div id="header">
    Claude Web — experimental
    <button id="continue-toggle" onclick="toggleContinue()">Continue: OFF</button>
  </div>
  <div id="messages"></div>
  <div id="input-area">
    <textarea id="prompt" placeholder="Send a message to Claude Code..." onkeydown="handleKey(event)"></textarea>
    <button id="send" onclick="sendMessage()">Send</button>
  </div>
  <script>
    let continueSession = false;
    let sending = false;

    function toggleContinue() {
      continueSession = !continueSession;
      const btn = document.getElementById("continue-toggle");
      btn.textContent = `Continue: ${continueSession ? "ON" : "OFF"}`;
      btn.classList.toggle("active", continueSession);
    }

    function handleKey(e) {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        sendMessage();
      }
    }

    function addMessage(cls) {
      const el = document.createElement("div");
      el.className = `msg ${cls}`;
      document.getElementById("messages").appendChild(el);
      el.scrollIntoView({ behavior: "smooth" });
      return el;
    }

    function appendText(el, text) {
      el.appendChild(document.createTextNode(text));
      el.scrollIntoView({ behavior: "smooth" });
    }

    function appendToolBadges(el, toolUses) {
      toolUses.forEach((tool) => {
        const badge = document.createElement("span");
        badge.className = "tool-badge";
        badge.textContent = tool.name;
        el.appendChild(badge);
      });
      el.appendChild(document.createTextNode("\n"));
    }

    function appendCostInfo(el, data) {
      const info = document.createElement("div");
      info.className = "cost-info";
      const cost = data.cost_usd ? `$${data.cost_usd.toFixed(4)}` : "—";
      const duration = data.duration_ms ? `${(data.duration_ms / 1000).toFixed(1)}s` : "—";
      const turns = data.num_turns ?? "—";
      info.textContent = `Cost: ${cost} | Duration: ${duration} | Turns: ${turns}`;
      el.appendChild(info);
    }

    async function sendMessage() {
      if (sending) return;
      const input = document.getElementById("prompt");
      const message = input.value.trim();
      if (!message) return;

      input.value = "";
      sending = true;
      document.getElementById("send").disabled = true;

      const userEl = addMessage("user");
      userEl.textContent = message;
      const responseEl = addMessage("assistant streaming");

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, continueSession }),
        });

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n");
          buffer = lines.pop();

          for (const line of lines) {
            if (!line.startsWith("data: ")) continue;
            const data = JSON.parse(line.slice(6));

            if (data.type === "assistant") {
              if (data.toolUses) {
                appendToolBadges(responseEl, data.toolUses);
              }
              if (data.text) {
                appendText(responseEl, data.text);
              }
            } else if (data.type === "tool_result") {
              const label = data.name ? `[${data.name}] ` : "";
              appendText(responseEl, `${label}${data.content ?? ""}\n`);
            } else if (data.type === "result") {
              appendCostInfo(responseEl, data);
              responseEl.classList.remove("streaming");
              if (data.subtype !== "success") {
                responseEl.classList.add("error");
              }
            } else if (data.type === "text") {
              appendText(responseEl, data.text + "\n");
            } else if (data.type === "error") {
              appendText(responseEl, data.text);
              responseEl.classList.remove("streaming");
              responseEl.classList.add("error");
            } else if (data.type === "done") {
              responseEl.classList.remove("streaming");
              if (data.code !== 0 && data.code !== null) {
                responseEl.classList.add("error");
              }
            }
          }
        }
      } catch (err) {
        responseEl.textContent = `Error: ${err.message}`;
        responseEl.classList.remove("streaming");
        responseEl.classList.add("error");
      }

      sending = false;
      document.getElementById("send").disabled = false;
      input.focus();
    }
  </script>
</body>
</html>
